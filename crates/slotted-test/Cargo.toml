[package]
name = "slotted-test"
description = "Headless UI test harness for games built on slotted: locators over the semantic tree, synthetic input through real picking, virtual time, screen-tree snapshots."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
documentation = "https://docs.rs/slotted-test"
homepage.workspace = true
keywords = ["bevy", "testing", "ui", "headless", "gamedev"]
categories = ["game-development", "development-tools::testing"]

[features]
default = ["snapshots"]
# `UiHarness::load_mods` and friends (Phase 4 contract section 3), plus the
# Lua `slotted.test` runner and the `test-mods` binary (Phase 6 section 3.2).
# The runtime comes from the facade's `script-luaur` feature, never named
# here: a consumer's own `slotted` dependency unifies it in.
script = ["dep:slotted-packs", "dep:slotted-script", "slotted/packs"]
# A runtime of this crate's own, for the `test-mods` binary: a consumer gets
# one through its own `slotted` dependency, but `cargo run -p slotted-test
# --bin test-mods` has no consumer to inherit from (Phase 6 section 3.2).
script-luaur = ["script", "slotted/script-luaur"]
# `assert_tree_snapshot!` through `insta`. Off for a wasm build of the crate
# (the playground shares the op implementations, not the snapshots).
snapshots = ["dep:insta"]
# Run the real renderer with a software adapter and compare pixels. Phase 7.
render = []

[[bin]]
name = "test-mods"
path = "src/bin/test_mods.rs"
required-features = ["script"]

[dependencies]
# A path dependency with the facade's defaults off, so a consumer that wants
# the harness without the script stack pays for neither (Phase 6 contract 3.2).
# A consumer that does want it depends on `slotted` with defaults and Cargo
# unifies the runtime back in. The crate's own tests re-enable it below.
slotted = { path = "../slotted", version = "0.1.0", default-features = false, features = ["ui", "browser"] }
slotted-model = { workspace = true }
slotted-registry = { workspace = true }
slotted-ecs = { workspace = true }
slotted-theme = { workspace = true }
slotted-ui = { workspace = true }
slotted-icons = { workspace = true }
slotted-browser = { workspace = true }
slotted-packs = { workspace = true, optional = true }
slotted-script = { workspace = true, optional = true }
# `debug` so a failing system parameter names itself (ADR 0002).
bevy = { workspace = true, features = [
    "std",
    "bevy_asset",
    "bevy_camera",
    "bevy_input_focus",
    "bevy_log",
    "bevy_picking",
    "bevy_scene",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_widgets",
    "bevy_window",
    "default_font",
    "ui_picking",
    "debug",
] }
insta = { workspace = true, optional = true }
serde = { workspace = true }
ron = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["js"] }

[dev-dependencies]
slotted = { path = "../slotted", version = "0.1.0", features = ["script-luaur"] }
slotted-testutils = { workspace = true }
pretty_assertions = { workspace = true }

[lints]
workspace = true
