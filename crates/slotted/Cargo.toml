[package]
name = "slotted"
description = "Facade for slotted: SlottedPlugins, the headless plugin group, prelude and feature flags."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
documentation = "https://docs.rs/slotted"
homepage.workspace = true
keywords = ["bevy", "inventory", "ui", "modding", "gamedev"]
categories = ["game-development", "gui"]

[features]
default = ["ui", "browser", "packs", "script-luaur", "gpu-icons"]
# Mods and resource packs: discovery, `pack://`, the script lifecycle (Phase 4).
# Independent of `ui`: a dedicated server loads the same mods with no widgets
# compiled in. With `ui` on, `slotted-packs/ui` comes with it and the pack
# lifecycle also publishes screens, tooltip parts and HUD layers.
packs = ["dep:slotted-packs", "dep:slotted-script"]
# The Luau runtime, inserted as `ScriptHost` when none exists. One runtime on
# every target, native and wasm alike (ADR 0004), so this is on by default and
# a wasm build does not have to swap it for anything.
script-luaur = ["packs", "dep:slotted-script-luaur"]
# Widgets, themes and icons. Off for a dedicated server.
#
# This is also where every Bevy UI feature is enabled. The facade's own `bevy`
# dependency below carries only what a headless simulation needs, so
# `--no-default-features` really does drop `bevy_ui`, `bevy_text`,
# `bevy_picking`, `bevy_window` and `bevy_scene` from the graph rather than
# just hiding our own wrappers around them.
ui = [
    "dep:slotted-ui",
    "dep:slotted-theme",
    "dep:slotted-icons",
    "slotted-packs?/ui",
    "bevy/bevy_camera",
    "bevy/bevy_input_focus",
    "bevy/bevy_picking",
    "bevy/bevy_scene",
    "bevy/bevy_text",
    "bevy/bevy_ui",
    "bevy/bevy_ui_widgets",
    "bevy/bevy_window",
    "bevy/default_font",
    "bevy/ui_picking",
]
# The dedicated-server profile: mods, scripts and the network authority, with
# no renderer and no UI stack. Use it as
# `default-features = false, features = ["server"]`; `just server-check` fails
# the build if a bevy UI crate ever reappears in this graph.
server = ["packs", "script-luaur", "net"]
# The item and recipe browser overlay (Phase 3).
browser = ["ui", "dep:slotted-browser"]
# Backdrop blur for glass panels (ADR 0003).
blur = ["ui", "slotted-theme/blur"]
# Exclusion-zone highlighter, id tooltips, the HUD position editor and the
# input recorder (Phase 6).
dev = ["ui", "slotted-ui/dev", "slotted-browser?/dev"]
# Real cameras behind `viewport` nodes (Phase 6 contract 1.6).
viewport = ["ui", "gpu-icons", "slotted-ui/viewport"]
# The offscreen three-point rig that renders item icons into the atlas. On by
# default; the bake falls back to the CPU at runtime when there is no
# renderer, so a headless app pays nothing but compile time.
gpu-icons = ["ui", "slotted-icons/gpu"]
# `IconDef::Model`: item icons baked from a glTF scene rather than from a
# primitive. Off by default, because `bevy_gltf` and `bevy_scene` are module
# size a game with no item models should not pay; without it a model draws
# the stand-in shape its data file declared.
gltf-icons = ["gpu-icons", "slotted-icons/gltf"]
# A turning 3D item behind the hovered slot's tooltip and the browser detail
# pane, instead of a flat atlas cell.
live-icons = ["viewport", "slotted-ui/live"]
# Client-server play: `slotted-net`'s `RemoteAuthority` replaces
# `LocalAuthority` when the app has inserted a `ClientTransport` resource. Off
# by default, because a single-player game should not compile a protocol it
# never speaks.
net = ["dep:slotted-net"]

[dependencies]
slotted-model = { workspace = true }
slotted-registry = { workspace = true, features = ["std-fs"] }
slotted-ecs = { workspace = true }
slotted-net = { workspace = true, optional = true }
slotted-theme = { workspace = true, optional = true }
slotted-ui = { workspace = true, optional = true }
slotted-icons = { workspace = true, optional = true }
slotted-browser = { workspace = true, optional = true }
slotted-packs = { workspace = true, optional = true }
slotted-script = { workspace = true, optional = true }
slotted-script-luaur = { workspace = true, optional = true }
# Only what a headless simulation needs. Everything the widgets need
# (`bevy_ui`, `bevy_text`, `bevy_picking`, `bevy_window`, `bevy_scene`,
# `default_font`, `ui_picking`) is enabled by the `ui` feature instead, so a
# `--no-default-features --features server` build never compiles Bevy's UI
# stack. The headless group in `plugins.rs` needs those crates and is itself
# behind `ui`.
bevy = { workspace = true, features = ["std", "bevy_asset", "bevy_log", "bevy_state"] }

[lints]
workspace = true
