[package]
name = "slotted-ui"
description = "Screen trees, widgets, anchors, injection, tooltips, semantic roles and HUD layers for slotted on bevy_ui."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
# Exclusion-zone highlighter, id tooltips, the HUD position editor and the
# input recorder (Phase 6 contract 2.2, 2.3). No extra dependencies.
dev = []
# Real cameras behind `viewport` nodes (Phase 6 contract 1.6). Pulls the
# renderer; off for headless tests and dedicated servers.
viewport = ["bevy/bevy_core_pipeline", "bevy/bevy_pbr", "bevy/bevy_render"]

[dependencies]
slotted-model = { workspace = true }
slotted-registry = { workspace = true }
slotted-ecs = { workspace = true }
slotted-theme = { workspace = true }
slotted-icons = { workspace = true }
# bevy_ui without bevy_ui_render: this crate lays out and picks, it does not
# draw, so it runs unchanged in the headless harness. bevy_scene is for `bsn!`.
bevy = { workspace = true, features = [
    "std",
    "bevy_asset",
    "bevy_camera",
    "bevy_input_focus",
    "bevy_log",
    "bevy_picking",
    "bevy_scene",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_widgets",
    "bevy_window",
    "ui_picking",
    # serde on `KeyCode`, `PointerButton` and the gamepad enums, for
    # `recording::Recording` (Phase 6 contract 2.3).
    "serialize",
] }
accesskit = { workspace = true }
serde = { workspace = true }
ron = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
slotted-test = { workspace = true }
pretty_assertions = { workspace = true }
# The headless tests need a font to measure text with and the schedule runner
# to step frames by hand; see ADR 0002.
bevy = { workspace = true, features = ["std", "default_font", "bevy_state"] }

[lints]
workspace = true
