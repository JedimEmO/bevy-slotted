[package]
name = "slotted-packs"
description = "Mods and resource packs for slotted: mod.toml discovery, a layered asset source and `pack://` reader, the data/control lifecycle that runs mod scripts, hot reload, Fluent localisation."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
documentation = "https://docs.rs/slotted-packs"
homepage.workspace = true
keywords = ["bevy", "mods", "assets", "fluent", "gamedev"]
categories = ["game-development"]

[features]
default = ["ui"]
# Widgets, screens, tooltips, HUD layers and the browser: everything the pack
# lifecycle publishes into `slotted-ui`, plus the observers that turn UI events
# into script events. On by default. Off for a dedicated server, which loads
# the same mods and runs the same control scripts with no Bevy UI stack
# compiled in at all.
ui = [
    "dep:slotted-ui",
    "dep:slotted-icons",
    "dep:slotted-browser",
    "bevy/bevy_text",
    "bevy/bevy_ui",
    "bevy/bevy_ui_widgets",
]
# Hot reload of scripts, RON and locale files through Bevy's file watcher.
watch = ["bevy/file_watcher"]

[dependencies]
slotted-model = { workspace = true }
slotted-registry = { workspace = true, features = ["std-fs"] }
slotted-ecs = { workspace = true }
slotted-ui = { workspace = true, optional = true }
slotted-icons = { workspace = true, optional = true }
slotted-browser = { workspace = true, optional = true }
slotted-script = { workspace = true }
bevy = { workspace = true, features = ["std", "bevy_asset", "bevy_log", "bevy_state"] }
serde = { workspace = true }
ron = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
fluent-bundle = { workspace = true }
unic-langid = { workspace = true }

[dev-dependencies]
slotted-testutils = { workspace = true }
pretty_assertions = { workspace = true }

[lints]
workspace = true
