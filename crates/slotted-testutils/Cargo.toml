[package]
name = "slotted-testutils"
description = "Internal fakes, builders and the script conformance suite for slotted. Dev-dependency only."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[features]
default = []
# The script conformance suite (Phase 4 contract section 1.7). Pulls in
# `slotted-script` and `ron`; adapters enable it from their dev-dependencies.
conformance = ["dep:slotted-script", "dep:ron", "dep:serde"]

[dependencies]
slotted-script = { workspace = true, optional = true }
ron = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
thiserror = { workspace = true }
slotted-model = { workspace = true }
slotted-registry = { workspace = true }
slotted-ecs = { workspace = true }
# Only what `minimal_ecs_app` needs. No rendering, no windowing: this crate is
# a dev-dependency of crates that must keep building on wasm.
bevy = { workspace = true, features = ["std"] }

[lints]
workspace = true
