[package]
name = "slotted-icons"
description = "The IconSource port for slotted with a baked-atlas adapter and a CPU placeholder bake."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
documentation = "https://docs.rs/slotted-icons"
homepage.workspace = true
keywords = ["bevy", "icons", "atlas", "ui", "gamedev"]
categories = ["game-development", "gui"]

[features]
default = []
# `LiveIcons`: a `ViewportNode` camera per requested item, for the hovered
# item and detail panes only (ADR 0003 measured ~0.8 ms per camera).
live = ["bevy/bevy_camera"]
# The offscreen three-point rig: icons rendered into a grid render target
# that *is* the atlas. No readback, so it works on WebGL2 too. Falls back to
# the CPU bake at runtime when the app has no renderer.
gpu = ["bevy/bevy_core_pipeline", "bevy/bevy_pbr", "bevy/bevy_render"]
# `IconDef::Model`: the GPU bake loads a glTF scene and lights it under the
# same rig. Off by default because `bevy_gltf` and `bevy_scene` are module
# size a build with no models pays for nothing; without it a model draws the
# stand-in shape its data file declared and warns once.
gltf = ["gpu", "bevy/bevy_gltf"]
# Bake at 128 px a cell instead of 64.
hidpi = []

[dependencies]
slotted-model = { workspace = true }
slotted-registry = { workspace = true }
slotted-ecs = { workspace = true }
bevy = { workspace = true, features = ["std", "bevy_asset", "bevy_image", "bevy_ui", "bevy_log"] }
wgpu-types = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
# `tests/gpu_bake.rs` builds a real app for the ignored render test; the graph
# tests beside it need only the asset collections.
bevy = { workspace = true, features = ["bevy_winit", "x11"] }

[lints]
workspace = true
