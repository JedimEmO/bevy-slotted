[package]
name = "slotted-registry"
description = "Namespaced registries, data-stage loading, freezing and patch lists for slotted. No Bevy."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["std-fs"]
# The `DirSource` adapter. Off for wasm, where there is no filesystem to read.
std-fs = []

[dependencies]
slotted-model = { workspace = true }
serde = { workspace = true }
ron = { workspace = true }
thiserror = { workspace = true }
indexmap = { workspace = true }
toml = { workspace = true }
semver = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }

[lints]
workspace = true
