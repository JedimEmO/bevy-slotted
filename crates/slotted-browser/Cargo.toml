[package]
name = "slotted-browser"
description = "Item and recipe browser for slotted: ingredient registry, categories, search index, browser panel, recipe transfer."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
# Exclusion-zone highlighter, id tooltips, copy recipe id. No extra dependencies.
dev = ["slotted-ui/dev"]

[dependencies]
slotted-model = { workspace = true }
slotted-registry = { workspace = true }
slotted-ecs = { workspace = true }
slotted-theme = { workspace = true }
slotted-icons = { workspace = true }
slotted-ui = { workspace = true }
# Same feature list as slotted-ui: the panel lays out and picks, it does not
# draw. `bevy_tasks` (via `std`) runs the index build off the main thread.
bevy = { workspace = true, features = [
    "std",
    "bevy_asset",
    "bevy_camera",
    "bevy_input_focus",
    "bevy_log",
    "bevy_picking",
    "bevy_scene",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_widgets",
    "bevy_window",
    "ui_picking",
] }
serde = { workspace = true }
ron = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
criterion = { workspace = true }
bevy = { workspace = true, features = ["std", "default_font", "bevy_state"] }

[[bench]]
name = "index"
harness = false

[lints]
workspace = true
