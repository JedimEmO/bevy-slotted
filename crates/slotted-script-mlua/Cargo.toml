[package]
name = "slotted-script-mlua"
description = "Native ScriptRuntime adapter for slotted: Luau through mlua, sandboxed, with interrupt budgets and a memory limit."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
documentation = "https://docs.rs/slotted-script-mlua"
homepage.workspace = true
keywords = ["bevy", "luau", "mlua", "scripting", "modding"]
categories = ["game-development"]

[dependencies]
slotted-script = { workspace = true }
slotted-model = { workspace = true }
mlua = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
slotted-testutils = { workspace = true, features = ["conformance"] }
pretty_assertions = { workspace = true }

[lints]
workspace = true
