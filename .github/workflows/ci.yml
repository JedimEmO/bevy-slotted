name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  native:
    name: Test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Bevy needs these on Linux. Nothing links against them yet, but the
      # first crate that pulls in bevy_audio or bevy_winit will, and finding
      # that out here rather than mid-review is cheaper.
      - name: Install Bevy system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native
          cache-on-failure: true
          # rust-cache keys on Cargo.lock and never rewrites an existing key;
          # a profile change in Cargo.toml would otherwise restore stale
          # artifacts forever and rebuild everything on every run.
          key: ${{ hashFiles('**/Cargo.toml', '.cargo/config.toml', 'rust-toolchain.toml') }}

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # docs/guide/api/ is generated from the `---` doc blocks in the Lua
      # prelude. A hand-edited or stale file fails here rather than shipping.
      - name: The generated Lua reference is current
        run: |
          cargo run -p xtask -- gen-docs --check
          cargo run -p xtask -- luau-stubs --check

      # Licences, advisories, banned crates and sources, from deny.toml.
      # `just ci` runs the same thing, so a red branch here is reproducible
      # locally with one command. An advisory that has been read and accepted
      # is a dated, single-id `ignore` entry in deny.toml, not a skipped step.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  wasm:
    name: Check (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm
          cache-on-failure: true
          # rust-cache keys on Cargo.lock and never rewrites an existing key;
          # a profile change in Cargo.toml would otherwise restore stale
          # artifacts forever and rebuild everything on every run.
          key: ${{ hashFiles('**/Cargo.toml', '.cargo/config.toml', 'rust-toolchain.toml') }}

      - uses: extractions/setup-just@v2

      # Every crate that has to reach a browser, not just the domain ones: the
      # playground puts the whole stack in a tab. See docs/PLAN.md section 1.
      - name: Check the stack on wasm
        run: just wasm-check

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.128 --locked

      # Ubuntu's binaryen (108) produces a module whose function table cannot
      # grow at runtime: `WebAssembly.Table.grow() failed` on first load. Pin
      # the release the local builds are verified with.
      - name: Install binaryen 119
        run: |
          curl -sSL https://github.com/WebAssembly/binaryen/releases/download/version_119/binaryen-version_119-x86_64-linux.tar.gz | tar xz
          echo "$PWD/binaryen-version_119/bin" >> "$GITHUB_PATH"

      - name: Build the playground
        run: just playground

      # The optimised module must actually instantiate in a browser before it
      # is allowed anywhere near Pages.
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - name: Instantiate the playground in headless Chrome
        env:
          CI: "true"
        run: |
          cargo run -p xtask -- serve &
          sleep 3
          mkdir -p "$HOME/snap/chromium/common"
          node examples/web-playground/tests/smoke.mjs --browser "${{ steps.chrome.outputs.chrome-path }}"

      # `always()`, not the default: a red smoke run is exactly when the
      # module and the page it died on are worth keeping.
      - name: Upload the playground
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-playground
          path: dist/web-playground

      # The screenshot the smoke driver takes of the page as it gave up, plus
      # anything else it left in dist/smoke.
      - name: Upload the smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-playground-smoke
          path: dist/smoke
          if-no-files-found: warn

  browser:
    name: Test (headless Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: browser
          cache-on-failure: true
          # rust-cache keys on Cargo.lock and never rewrites an existing key;
          # a profile change in Cargo.toml would otherwise restore stale
          # artifacts forever and rebuild everything on every run.
          key: ${{ hashFiles('**/Cargo.toml', '.cargo/config.toml', 'rust-toolchain.toml') }}

      # A browser is installed rather than looked for. This used to skip
      # itself when the runner had no Chrome, which meant the one job that
      # exercises the script runtime in a tab could report success without
      # running anything, on the very branch that then deploys.
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked

      # The one script runtime, in the one place its behaviour differs from
      # the native run (ADR 0004). The cases here are the ones that must work
      # in a tab; the error-recovery ones are deliberately absent, because on
      # wasm a raise aborts the module rather than returning, which is the
      # trade ADR 0004 accepts. Their native twins are in the same crate and
      # the Test (ubuntu) job runs them.
      - name: luaur in a browser
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: wasm-pack test --headless --chrome crates/slotted-script-luaur --test wasm

  server:
    name: Dedicated-server graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: server
          cache-on-failure: true
          # rust-cache keys on Cargo.lock and never rewrites an existing key;
          # a profile change in Cargo.toml would otherwise restore stale
          # artifacts forever and rebuild everything on every run.
          key: ${{ hashFiles('**/Cargo.toml', '.cargo/config.toml', 'rust-toolchain.toml') }}

      - uses: extractions/setup-just@v2

      # `slotted`'s feature comments promise that `default-features = false`
      # is a server build with no Bevy UI stack. Cargo features are additive,
      # so one `bevy/bevy_ui` in any crate below the facade breaks that for
      # every consumer and nothing but this fails when it happens. The recipe
      # greps `cargo tree` and then builds the profile on native and on wasm.
      - name: No bevy_ui in the server graph
        run: just server-check

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bevy system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: docs
          cache-on-failure: true
          # rust-cache keys on Cargo.lock and never rewrites an existing key;
          # a profile change in Cargo.toml would otherwise restore stale
          # artifacts forever and rebuild everything on every run.
          key: ${{ hashFiles('**/Cargo.toml', '.cargo/config.toml', 'rust-toolchain.toml') }}

      # A broken intra-doc link is a warning by default, which means it lives
      # forever. RUSTDOCFLAGS makes it a build failure. `--no-deps` because we
      # publish our own crates' docs, not the whole dependency tree's.
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

      # The guide is Markdown. GitHub renders it in the repository; the Pages
      # copy is the raw files plus an index, so a docs.rs link and a guide link
      # can sit side by side.
      - name: Assemble the docs site
        run: |
          mkdir -p site/doc site/guide
          cp -r target/doc/. site/doc/
          cp -r docs/guide/. site/guide/
          repo="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/main/docs/guide"
          {
            echo '<!doctype html><meta charset="utf-8"><title>slotted guide</title>'
            echo '<h1>slotted</h1>'
            echo '<ul>'
            echo "<li><a href=\"../\">The web playground</a></li>"
            echo "<li><a href=\"../doc/slotted/index.html\">API documentation</a></li>"
            echo '</ul><h2>Guide</h2><ul>'
            for f in $(cd docs/guide && ls *.md); do
              echo "<li><a href=\"${repo}/${f}\">${f}</a> (<a href=\"${f}\">raw</a>)</li>"
            done
            echo '</ul>'
          } > site/guide/index.html

      - name: Upload the docs site
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site

  pages:
    name: Deploy the playground and the docs
    # Every validation job, not just the two that produce the artifacts.
    # Deployment used to depend on `wasm` and `docs` alone, so a push to the
    # default branch published the playground and the documentation while the
    # native tests, Clippy, `cargo deny` or the browser tests were red.
    needs: [native, wasm, browser, server, docs]
    if: contains(fromJSON('["refs/heads/main","refs/heads/master"]'), github.ref)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # The playground stays at the site root, so its URL does not move; the
      # rustdoc and the guide go underneath it.
      - uses: actions/download-artifact@v4
        with:
          name: web-playground
          path: site

      - uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
