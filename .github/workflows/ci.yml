name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  native:
    name: Test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Bevy needs these on Linux. Nothing links against them yet, but the
      # first crate that pulls in bevy_audio or bevy_winit will, and finding
      # that out here rather than mid-review is cheaper.
      - name: Install Bevy system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # docs/guide/api/ is generated from the `---` doc blocks in the Lua
      # prelude. A hand-edited or stale file fails here rather than shipping.
      - name: The generated Lua reference is current
        run: |
          cargo run -p xtask -- gen-docs --check
          cargo run -p xtask -- luau-stubs --check

  wasm:
    name: Check (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: extractions/setup-just@v2

      # Every crate that has to reach a browser, not just the domain ones: the
      # playground puts the whole stack in a tab. See docs/PLAN.md section 1.
      - name: Check the stack on wasm
        run: just wasm-check

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.128 --locked

      - name: Install binaryen
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - name: Build the playground
        run: just playground

      - name: Upload the playground
        uses: actions/upload-artifact@v4
        with:
          name: web-playground
          path: dist/web-playground

  browser:
    name: Test (headless Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # The browser tests are the only thing in the workspace that needs a
      # browser, and a runner without one must not fail the build. This is an
      # `if` on a detected binary rather than `continue-on-error`, because
      # `continue-on-error` also swallows a real failure of the tests.
      - name: Find a Chrome
        id: chrome
        run: |
          for candidate in "$CHROME" "$CHROME_BIN" google-chrome chromium chromium-browser; do
            [ -n "$candidate" ] || continue
            found=$(command -v "$candidate" 2>/dev/null || true)
            if [ -n "$found" ]; then
              echo "path=$found" >> "$GITHUB_OUTPUT"
              break
            fi
          done

      - name: Say why there are no browser tests
        if: steps.chrome.outputs.path == ''
        run: |
          echo "::notice title=Browser tests skipped::No Chrome or Chromium on this runner, so slotted-script-luaur's wasm-bindgen tests did not run. Each of them has a native twin in the same crate, which the Test (ubuntu) job ran."

      - name: Install wasm-pack
        if: steps.chrome.outputs.path != ''
        run: cargo install wasm-pack --version 0.13.1 --locked

      # The one script runtime, in the one place its behaviour differs from
      # the native run (ADR 0004). The cases here are the ones that must work
      # in a tab; the error-recovery ones are deliberately absent, because on
      # wasm a raise aborts the module rather than returning, which is the
      # trade ADR 0004 accepts. Their native twins are in the same crate and
      # the Test (ubuntu) job runs them.
      - name: luaur in a browser
        if: steps.chrome.outputs.path != ''
        env:
          CHROME: ${{ steps.chrome.outputs.path }}
        run: wasm-pack test --headless --chrome crates/slotted-script-luaur --test wasm

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bevy system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # A broken intra-doc link is a warning by default, which means it lives
      # forever. RUSTDOCFLAGS makes it a build failure. `--no-deps` because we
      # publish our own crates' docs, not the whole dependency tree's.
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

      # The guide is Markdown. GitHub renders it in the repository; the Pages
      # copy is the raw files plus an index, so a docs.rs link and a guide link
      # can sit side by side.
      - name: Assemble the docs site
        run: |
          mkdir -p site/doc site/guide
          cp -r target/doc/. site/doc/
          cp -r docs/guide/. site/guide/
          repo="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/main/docs/guide"
          {
            echo '<!doctype html><meta charset="utf-8"><title>slotted guide</title>'
            echo '<h1>slotted</h1>'
            echo '<ul>'
            echo "<li><a href=\"../\">The web playground</a></li>"
            echo "<li><a href=\"../doc/slotted/index.html\">API documentation</a></li>"
            echo '</ul><h2>Guide</h2><ul>'
            for f in $(cd docs/guide && ls *.md); do
              echo "<li><a href=\"${repo}/${f}\">${f}</a> (<a href=\"${f}\">raw</a>)</li>"
            done
            echo '</ul>'
          } > site/guide/index.html

      - name: Upload the docs site
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site

  pages:
    name: Deploy the playground and the docs
    needs: [wasm, docs]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # The playground stays at the site root, so its URL does not move; the
      # rustdoc and the guide go underneath it.
      - uses: actions/download-artifact@v4
        with:
          name: web-playground
          path: site

      - uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
