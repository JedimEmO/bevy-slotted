# The developer shell on this machine exports an Anaconda C/C++ toolchain
# (CC/CXX pointing into ~/anaconda3, CFLAGS with `-march=nocona`, CPPFLAGS and
# LDFLAGS pointing at Anaconda's sysroot). ADR 0001 records what that does to a
# vendored C++ build: mlua's Luau compiles and links, then dies with SIGFPE
# inside `Lua::new()` because a global constructor never ran. The failure mode is
# a crash at runtime, not a build error, so it has to be prevented rather than
# detected. `force = true` makes these win over the inherited environment for
# every `cargo` invocation in this workspace, including `cc`-driven builds in
# build scripts.
[env]
CC = { value = "cc", force = true }
CXX = { value = "c++", force = true }
CFLAGS = { value = "", force = true }
CXXFLAGS = { value = "", force = true }
CPPFLAGS = { value = "", force = true }
LDFLAGS = { value = "", force = true }

[build]
# Intentionally no shared `target-dir`: each checkout keeps its own ./target so
# a wasm build and a native build never race for the same lock. Add rustflags
# here only if every member needs them; per-crate flags belong in the crate.
