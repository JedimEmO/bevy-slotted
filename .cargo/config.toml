# There is deliberately no `[env]` block pinning `CC`/`CXX`/`CFLAGS` here any
# more. It existed for exactly one thing: mlua's vendored Luau, a C++ build that
# the developer shell's Anaconda toolchain (`CC`/`CXX` into ~/anaconda3,
# `CFLAGS` with `-march=nocona`, `CPPFLAGS` into Anaconda's sysroot)
# miscompiled into a binary that died with `SIGFPE` inside `Lua::new()`.
# ADR 0001 has the details.
#
# ADR 0004 made luaur the only script runtime and `slotted-script-mlua` is
# gone, so nothing in the workspace compiles C or C++:
# `cargo tree -e build --workspace --all-features` lists no build dependencies
# at all, `cc` and `luau0-src` among them. Bring the pin back, naming the crate
# that needs it, if a dependency ever reintroduces a `cc`-driven build script.

[build]
# Intentionally no shared `target-dir`: each checkout keeps its own ./target so
# a wasm build and a native build never race for the same lock. Add rustflags
# here only if every member needs them; per-crate flags belong in the crate.
