[workspace]
resolver = "3"
# Examples are workspace members so `cargo check --workspace --all-targets` and
# `just ci` cover them; each one sets `publish = false`.
members = ["crates/*", "examples/*", "tools/*"]
# Phase 0 spikes are standalone throwaway crates with their own lockfiles.
exclude = ["spikes/*"]

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/JedimEmO/bevy-slotted"
homepage = "https://github.com/JedimEmO/bevy-slotted"
authors = ["Mathias Myrland <jedimemo@gmail.com>"]

[workspace.dependencies]
# Members enable the Bevy features they need; the workspace pins the version.
bevy = { version = "0.19.1", default-features = false }

serde = { version = "1.0.229", features = ["derive"] }
ron = "0.12.2"
thiserror = "2.0.20"
anyhow = "1.0.104"
tracing = "0.1.44"
smallvec = "1.16.0"
indexmap = { version = "2.14.2", features = ["serde"] }
toml = "1.1.3"
semver = { version = "1.0.28", features = ["serde"] }
# Pinned to the version bevy_image 0.19 uses; slotted-icons needs the texture
# descriptor types to build an atlas on the CPU without bevy_render.
wgpu-types = { version = "29.0.3", default-features = false }
# Pinned to the version bevy_a11y 0.19 uses; slotted-ui builds AccessKit nodes.
accesskit = { version = "0.24", default-features = false }
uuid = { version = "1", features = ["v4"] }
# luaur: a pure-Rust, line-for-line port of Luau. The one script runtime, on
# every target (ADR 0004). Nothing else in the workspace is a Lua VM.
#
# `luaur-rt` rather than the `luaur` umbrella. The umbrella depends on
# `luaur-analysis`, `luaur-config` and `luaur-require` unconditionally — a
# static type checker and a module resolver an embedder never calls. `luaur-rt`
# is the safe embedding API and nothing else, and it is what the umbrella
# re-exports anyway. It did not change the optimised wasm size (26.47 MiB
# against 26.46), so linker DCE was already dropping the analyser; it is one
# fewer thing to compile and one fewer thing in the dependency graph.
#
# `send` makes the VM movable between threads, which the
# `ScriptRuntime: Send + Sync` bound needs.
luaur-rt = { version = "0.1.8", default-features = false, features = ["serde", "send"] }
# Own `.ftl` loader for mod localisation (Phase 4 contract section 2.7).
fluent-bundle = "0.16"
unic-langid = { version = "0.9", features = ["macros"] }

# Dev-only, shared so every crate tests with the same versions.
proptest = "1.11.0"
insta = { version = "1.47.2", features = ["ron"] }
criterion = "0.8.2"
pretty_assertions = "1.4.1"

# Internal crates. `path` is what the workspace builds against; `version` is
# what a published crate records, and it keeps `cargo deny` from reading these
# as wildcard dependencies.
slotted-model = { path = "crates/slotted-model", version = "0.1.0" }
slotted-registry = { path = "crates/slotted-registry", version = "0.1.0", default-features = false }
# No `version`, unlike the others. It is `publish = false`, and a dev-dependency
# carrying a version is written into a packaged manifest, where crates.io then
# cannot resolve it: `cargo publish` of every crate that tests against it fails
# with "no matching package named `slotted-testutils`". Path-only dev-deps are
# stripped at packaging time instead. `deny.toml`'s `allow-wildcard-paths`
# covers the wildcard this leaves in the graph.
slotted-testutils = { path = "crates/slotted-testutils" }
slotted-ecs = { path = "crates/slotted-ecs", version = "0.1.0" }
slotted-net = { path = "crates/slotted-net", version = "0.1.0" }
slotted-theme = { path = "crates/slotted-theme", version = "0.1.0" }
slotted-ui = { path = "crates/slotted-ui", version = "0.1.0" }
slotted-icons = { path = "crates/slotted-icons", version = "0.1.0" }
slotted-browser = { path = "crates/slotted-browser", version = "0.1.0" }
# No `version`, like `slotted-testutils` and for a related reason. This is only
# ever a dev-dependency here, and it is a cycle: `slotted-test` depends on the
# facade, which depends on `slotted-ui`, whose own tests drive the harness.
# Cargo allows the cycle in the workspace because dev-dependencies never enter
# a library's build graph, but a version in a packaged manifest would demand
# that `slotted-test` reach crates.io before `slotted-ui`, which is impossible.
# Path-only, so packaging strips it. Consumers still depend on the published
# `slotted-test` normally; nothing publishable here does.
slotted-test = { path = "crates/slotted-test" }
slotted-script = { path = "crates/slotted-script", version = "0.1.0" }
slotted-script-luaur = { path = "crates/slotted-script-luaur", version = "0.1.0" }
slotted-packs = { path = "crates/slotted-packs", version = "0.1.0", default-features = false }
slotted = { path = "crates/slotted", version = "0.1.0" }

# Bevy is slow in a plain dev profile; optimise dependencies as the spikes did.
# Keep dev builds fast to run but small on disk: dependencies optimised, and
# debuginfo limited to line tables. Full debuginfo grew target/ past 250 GB
# with several feature permutations compiled side by side.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.test]
debug = "line-tables-only"

# What `cargo xtask wasm-build` uses. A plain `--release` wasm module is over
# 80 MiB because release keeps debuginfo and every generic Bevy instantiates;
# this is the same code with the symbols dropped and size chosen over speed,
# which is the trade a page load wants. Native release builds are untouched.
[profile.wasm-release]
inherits = "release"
# "z" rather than "s". Together with dropping `bevy_scene` from the playground
# it took the optimised module from 26.46 MiB to 23.05 MiB, and nothing here is
# a hot inner loop: the frame cost is the renderer, not this code.
opt-level = "z"
lto = "thin"
codegen-units = 16
# Symbols too, not only debuginfo: the name section alone was 65 MiB and
# quadrupled wasm-opt time. Thin LTO with 16 units trades a little size for a
# compile that CI can finish in minutes; measurements in docs/FOLLOWUPS.md.
strip = true
panic = "abort"

# The small build for a tagged release of the playground: fat LTO, one
# codegen unit, and `cargo xtask playground --dist` pairs it with `wasm-opt -Oz`.
# About four minutes to compile and six to optimise for a module a quarter
# smaller; CI pushes use `wasm-release` instead.
[profile.wasm-dist]
inherits = "wasm-release"
lto = "fat"
codegen-units = 1

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
# Bevy systems take `Res<T>`, `On<E>` and friends by value by design.
needless_pass_by_value = "allow"
# Bevy queries are long by nature.
type_complexity = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "warn"

