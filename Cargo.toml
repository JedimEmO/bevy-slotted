[workspace]
resolver = "3"
# Phase 1 ships only the domain crates. `examples/*` and `tools/xtask` join the
# members list in later phases (see docs/PLAN.md section 3).
members = ["crates/*"]
# Phase 0 spikes are standalone throwaway crates with their own lockfiles.
exclude = ["spikes/*"]

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mathiasmyrland/bevy-slotted"
authors = ["Mathias Myrland <jedimemo@gmail.com>"]

[workspace.dependencies]
# Members enable the Bevy features they need; the workspace pins the version.
bevy = { version = "0.19.1", default-features = false }

serde = { version = "1.0.229", features = ["derive"] }
ron = "0.12.2"
thiserror = "2.0.20"
anyhow = "1.0.104"
tracing = "0.1.44"
smallvec = "1.16.0"
indexmap = { version = "2.14.2", features = ["serde"] }
toml = "1.1.3"
semver = { version = "1.0.28", features = ["serde"] }

# Dev-only, shared so every crate tests with the same versions.
proptest = "1.11.0"
insta = { version = "1.47.2", features = ["ron"] }
criterion = "0.8.2"
pretty_assertions = "1.4.1"

# Internal crates. `path` is what the workspace builds against; `version` is
# what a published crate records, and it keeps `cargo deny` from reading these
# as wildcard dependencies.
slotted-model = { path = "crates/slotted-model", version = "0.1.0" }
slotted-registry = { path = "crates/slotted-registry", version = "0.1.0" }
slotted-testutils = { path = "crates/slotted-testutils", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "warn"
