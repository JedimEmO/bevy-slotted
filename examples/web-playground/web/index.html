<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>slotted — showcase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Manrope:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="playground.css">
</head>
<body>
<header class="bar">
  <h1 class="disp">slotted<span class="dim"> / showcase</span></h1>
  <p class="blurb">The whole stack in one tab: one Bevy app, one wasm module, eight scenes. Pick one on the left; the controls for it are on the right.</p>
  <span class="spacer"></span>
  <span id="status" class="status">booting…</span>
</header>

<main class="split">
  <!-- The scene rail (docs/design/showcase-contract.md section 5). Filled
       from the module's `list_scenes` export; the static list is what shows
       while the module compiles and if it never comes up. -->
  <nav id="rail" class="rail" aria-label="scenes">
    <ol id="rail-list" class="rail-list" role="tablist"></ol>
  </nav>

  <section class="stage-col">
    <div id="scene-head" class="scene-head">
      <div class="scene-title"><span id="scene-num" class="eyebrow">01</span><h2 id="scene-title" class="disp">…</h2></div>
      <p id="scene-caption" class="scene-caption"></p>
      <ul id="scene-tries" class="scene-tries"></ul>
    </div>
    <section class="stage panel">
      <canvas id="slotted-canvas" tabindex="0"></canvas>
      <div id="boot" class="boot"><span class="spinner"></span><span>compiling the wasm module…</span></div>
    </section>
  </section>

  <section class="side">
    <!-- One control block per scene; `renderControls` shows the active one.
         Only the Mods block is real today; the others are the disabled shape
         the page will fill as each scene's exports stop saying "not yet". -->
    <div id="controls-stub" class="panel controls-stub" hidden>
      <span class="eyebrow">controls</span>
      <p id="controls-stub-text" class="muted"></p>
    </div>
    <div id="controls-mods" class="panel editor-panel">
      <div class="tabs">
        <label class="pick">
          <span class="eyebrow">mod</span>
          <select id="mod-select"></select>
        </label>
        <div id="file-tabs" class="file-tabs"></div>
      </div>
      <div id="editor-host" class="editor-host"></div>
      <div id="tests-host" class="tests-host" hidden></div>
      <div class="actions">
        <button id="run" class="primary" type="button">Run <kbd>Ctrl</kbd><kbd>↵</kbd></button>
        <button id="reset" type="button">Reset file</button>
        <label class="toggle"><input id="auto" type="checkbox" checked><span>Run on idle</span></label>
        <span class="spacer"></span>
        <button id="share" type="button">Copy link</button>
      </div>
    </div>

    <div class="panel console-panel">
      <div class="console-head"><span class="eyebrow">console</span><button id="clear" type="button">Clear</button></div>
      <div id="console" class="console"></div>
    </div>
  </section>
</main>

<script src="playground.js" type="module"></script>
</body>
</html>
