<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>smoke: pending</title>
<style>body{background:#0b0e14;color:#e6edf3;font:13px/1.6 monospace;margin:0;padding:16px}
canvas{position:absolute;left:-4000px;width:640px;height:360px}
#out{white-space:pre-wrap}</style>
</head>
<body>
<!-- The app still needs a canvas; the point of this page is the exports. -->
<canvas id="slotted-canvas"></canvas>
<div id="out">running…</div>
<script type="module">
// The deployed artifact's own end-to-end check, run in a headless browser by
// `just smoke` (see docs/design/phase5-notes-B.md section 7). It edits a mod's
// control.lua through the same export the editor uses and asserts the reloaded
// script's log line comes back out of the console queue.
//
// This page talks to the raw exports and has no restart machinery of its own,
// so the one check that ends the module is deliberately last. `index.html` is
// the page that survives an abort; `tests/smoke.mjs` drives that half.
import init, {
  list_mods,
  get_mod_file,
  reload_mod,
  drain_console,
  set_canvas_console,
  set_scene,
} from './web_playground.js';

const MARKER = 'smoke: the edited control chunk ran';

// The editable mods the bundle carries, as `bundle::script_mod_ids()` orders
// them. Naming them rather than counting them is deliberate: a count drifts
// silently when a mod is added, and the failure then reads as "3 is not 4"
// rather than as the name of what changed. `tests/smoke_page.rs` asserts this
// line against the Rust, so the two cannot disagree.
const EXPECTED_MODS = ['appleskin_like', 'copper_chest', 'hud_clock', 'sorter'];
const EXPECTED_FILES = 2;
const sameMods = (list) =>
  list.length === EXPECTED_MODS.length && list.every((m, i) => m.id === EXPECTED_MODS[i]);
const results = [];
const check = (name, ok, detail = '') => results.push({ name, ok, detail });

// Where the page has got to. On wasm a Lua error aborts the whole module
// (ADR 0004) and this page has no restart machinery, so a trap leaves every
// later check failing with nothing to say. The driver reads this after a
// failure to report the stage the module died in rather than only the
// checks that never got to run.
//
// Each entry also carries how many animation frames the previous stage saw
// and the longest single main-thread task inside it. A stage that took 23 s
// over 2 frames with a 21 s task is a frame that stalled; the same 23 s over
// 1400 frames is the page waiting on something that never came.
let frames = 0;
const tick = () => {
  frames += 1;
  requestAnimationFrame(tick);
};
requestAnimationFrame(tick);
let longestTask = 0;
try {
  new PerformanceObserver((list) => {
    for (const entry of list.getEntries()) longestTask = Math.max(longestTask, entry.duration);
  }).observe({ type: 'longtask', buffered: true });
} catch {
  // Not every browser reports long tasks; the timeline then just omits them.
}
const stage = (name) => {
  // "boot @47ms -[7 frames, longest task 201ms]-> list-mods @2089ms"
  const mark = `${name} @${Math.round(performance.now())}ms`;
  const previous = window.__smokeStage
    ? `[${frames} frames, longest task ${Math.round(longestTask)}ms]-> `
    : '';
  window.__smokeStage = name;
  window.__smokeStages = (window.__smokeStages ?? []).concat(`${previous}${mark}`);
  frames = 0;
  longestTask = 0;
};
stage('boot');
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
/** Resolves after `n` animation frames, however long they take. */
const nextFrames = (n) =>
  new Promise((resolve) => {
    const step = (left) => (left <= 0 ? resolve() : requestAnimationFrame(() => step(left - 1)));
    step(n);
  });
// How long the last check waits for the trap. The chunk runs on the next
// frame the app gets to; see the note above the check for why a frame can be
// a long time coming.
const ABORT_WAIT_MS = 40000;

async function drainUntil(marker, ms) {
  const deadline = Date.now() + ms;
  const seen = [];
  while (Date.now() < deadline) {
    for (const line of JSON.parse(drain_console())) {
      seen.push(`[${line.level}/${line.who}] ${line.text}`);
      if (line.text.includes(marker)) return { found: true, seen };
    }
    await sleep(50);
  }
  return { found: false, seen };
}

/** Everything the console said over `ms`, as one array of rendered lines. */
async function drainFor(ms) {
  const deadline = Date.now() + ms;
  const seen = [];
  while (Date.now() < deadline) {
    for (const line of JSON.parse(drain_console())) {
      seen.push(`[${line.level}/${line.who}] ${line.text}`);
    }
    await sleep(50);
  }
  return seen;
}

/** The control chunk the demo ships, so a check can put the mod back. */
const ORIGINAL_CONTROL = () => get_mod_file('copper_chest', 'control.lua');
const ORIGINAL_DATA = () => get_mod_file('copper_chest', 'data.lua');

/** A control chunk that logs `marker` and still answers a click. */
const chunkLogging = (marker) =>
  `slotted.info(${JSON.stringify(marker)})\n` +
  'slotted.on("slot_click", function(ev)\n  slotted.info("edited slot %d", ev.slot)\nend)\n';

async function main() {
  try {
    await init();
  } catch (error) {
    if (!String(error).includes('control flow')) throw error;
  }

  // The Mods scene: the playground as it was, the Lua chest and no item
  // browser. The page boots on the Chest scene, which since the showcase
  // refresh docks the browser, and a data reload with the browser docked
  // rebuilds every item card; on a runner with nothing but SwiftShader that
  // one frame was measured at 60 s. This page is about the exports, and the
  // Chest scene has the lap and index.html to prove it.
  set_scene('mods');

  stage('list-mods');
  const mods = JSON.parse(list_mods());
  check('list_mods names the bundled demo mods', sameMods(mods), JSON.stringify(mods.map((m) => m.id)));

  stage('get-mod-file');
  const control = get_mod_file('copper_chest', 'control.lua');
  check('get_mod_file returns the bundled chunk', control.includes('slotted.on("slot_click"'), `${control.length} bytes`);

  // The app boots on animation frames; give it some before asking for a reload.
  await sleep(1200);
  drain_console();

  reload_mod(
    'copper_chest',
    '',
    `slotted.info(${JSON.stringify(MARKER)})\n` +
      'slotted.on("slot_click", function(ev)\n  slotted.info("edited slot %d", ev.slot)\nend)\n',
  );

  stage('reload-logs');
  const { found, seen } = await drainUntil(MARKER, 8000);
  check('the reloaded control chunk logged through the console queue', found, seen.slice(-8).join('\n'));

  // -------------------------------------------------------------------------
  // The adversarial half: everything a person can do to this page by accident.
  // -------------------------------------------------------------------------

  // A chunk that will not compile. The mod must keep answering with the last
  // good chunk, and the page must be told why.
  reload_mod('copper_chest', '', 'slotted.on("slot_click", function(ev)\n');
  stage('compile-error');
  const broken = await drainFor(3000);
  check(
    'a compile error is reported and does not take the module down',
    broken.some((line) => line.startsWith('[error/')),
    broken.slice(-4).join('\n'),
  );

  // The mod list and the bundled text are untouched by either failure.
  const afterFailures = JSON.parse(list_mods());
  check(
    'list_mods is the same after two failed reloads',
    sameMods(afterFailures) && afterFailures.every((m) => m.files.length === EXPECTED_FILES),
    JSON.stringify(afterFailures.map((m) => m.id)),
  );

  // A name the page made up is an error, not a dead canvas.
  let threw = false;
  try {
    get_mod_file('no_such_mod', 'control.lua');
  } catch {
    threw = true;
  }
  check('get_mod_file throws on an unknown mod rather than aborting', threw);

  // Two reloads in one turn: both run, in the order they were asked for.
  drain_console();
  reload_mod('copper_chest', ORIGINAL_DATA(), chunkLogging('smoke: first of two'));
  reload_mod('copper_chest', '', chunkLogging('smoke: second of two'));
  stage('two-queued-reloads');
  const both = await drainFor(8000);
  const firstAt = both.findIndex((line) => line.includes('smoke: first of two'));
  const secondAt = both.findIndex((line) => line.includes('smoke: second of two'));
  check(
    'two reloads queued together both ran, in order',
    firstAt >= 0 && secondAt > firstAt,
    both.slice(-8).join('\n'),
  );

  // The overlay export is reachable and the game survives being told to draw
  // it, which is the only thing this page can assert about a hidden canvas.
  // The overlay stays up for a few animation frames rather than a number of
  // milliseconds, so it is drawn at least once however slow the machine is.
  //
  // Only with `?overlay` in the URL, which `tests/smoke.mjs` adds outside CI.
  // The first frame that draws the overlay's text costs about a second here
  // whatever the CPU throttle, and on a runner with nothing but SwiftShader
  // the frames around it were measured at 7 to 22 s each, which is more
  // than the check is worth; the reload after it is kept, because that is
  // what proves the page can still be driven.
  if (new URLSearchParams(location.search).has('overlay')) {
    stage('canvas-console');
    set_canvas_console(true);
    await nextFrames(3);
    set_canvas_console(false);
  }
  drain_console();
  reload_mod('copper_chest', '', ORIGINAL_CONTROL());
  stage('reload-after-canvas-console');
  const alive = await drainUntil('reloaded', 40000);
  check('the game still reloads after all of that', alive.found, alive.seen.slice(-4).join('\n'));

  // ---------------------------------------------------------------------
  // Last, because it ends the module. On wasm a Lua error is a trap
  // (ADR 0004), so a runaway chunk that exhausts the interrupt budget does
  // not come back as an error line the way it did under piccolo: it takes
  // the module with it. This page has no restart machinery — `index.html`
  // does, and `tests/smoke.mjs` drives that — so the assertion here is
  // simply that the abort happens and is visible to the page, which is what
  // a host has to key its restart off.
  //
  // Everything is rendered before the trigger, because after it nothing in
  // this module runs again.
  // ---------------------------------------------------------------------
  stage('runaway-abort');
  render('running the abort check…');

  const aborted = await new Promise((resolve) => {
    let settled = false;
    const done = (value) => {
      if (settled) return;
      settled = true;
      resolve(value);
    };
    window.addEventListener('error', (event) => {
      const text = String(event.error ?? event.message);
      if (/RuntimeError|unreachable|out of bounds|table index/i.test(text)) done(text);
    });
    window.addEventListener('unhandledrejection', (event) => {
      const text = String(event.reason);
      if (/RuntimeError|unreachable|out of bounds|table index/i.test(text)) done(text);
    });
    setTimeout(() => done(null), ABORT_WAIT_MS);
    reload_mod('copper_chest', 'while true do end\n', '');
  });

  check(
    'a runaway chunk aborts the module, visibly, as ADR 0004 says it must',
    aborted !== null,
    aborted ? String(aborted).slice(0, 160) : `no trap reached the page within ${ABORT_WAIT_MS / 1000}s`,
  );

  render();
}

/** Puts the results so far on the page and in the title. */
function render(pending = null) {
  const passed = results.every((r) => r.ok);
  document.title = pending ? 'smoke: pending' : passed ? 'smoke: pass' : 'smoke: fail';
  document.getElementById('out').textContent =
    results.map((r) => `${r.ok ? 'PASS' : 'FAIL'}  ${r.name}\n      ${r.detail}`).join('\n') +
    (pending ? `\n\n${pending}` : `\n\nRESULT ${passed ? 'PASS' : 'FAIL'}`);
}

main().catch((error) => {
  document.title = 'smoke: fail';
  document.getElementById('out').textContent = `RESULT FAIL\n${error?.stack ?? error}`;
});
</script>
</body>
</html>
