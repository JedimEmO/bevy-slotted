[package]
name = "web-playground"
description = "slotted example: the modded demo in a browser tab, with the mods' Lua editable live beside the canvas."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Backdrop blur. Off by default: it is a second scene render per frame, and
# WebGL2 is where that costs the most (ADR 0003).
blur = ["slotted/blur"]

[dependencies]
# `gpu-icons` is off, which is the only thing the facade's defaults carry that
# this page does not want. A path dependency rather than the workspace one,
# because a workspace dependency cannot be inherited with
# `default-features = false`. The runtime comes in below, inserted directly.
slotted = { path = "../../crates/slotted", version = "0.1.0", default-features = false, features = ["ui", "browser", "packs", "dev"] }
slotted-packs = { workspace = true, features = ["ui"] }
slotted-script = { workspace = true }
slotted-script-luaur = { path = "../../crates/slotted-script-luaur", version = "0.1.0" }
slotted-model = { workspace = true }
slotted-registry = { workspace = true }
# The scene table the rail, the bridge and the native tests share
# (docs/design/showcase-contract.md section 1).
showcase = { path = "../showcase" }
# The op implementations the Tests tab drives against the live app. Defaults
# off: `insta` is a native snapshot library the page has no use for.
slotted-test = { path = "../../crates/slotted-test", version = "0.1.0", default-features = false, features = ["script"] }
bevy = { version = "0.19.1", default-features = false, features = [
    "bevy_ui_widgets",
    "bevy_asset",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_render",
    # No bevy_scene, bevy_audio, bevy_gltf or bevy_gizmos: nothing here loads a
    # scene file, plays a sound or draws a gizmo, and each is module size.
    "bevy_state",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_window",
    "bevy_winit",
    "default_font",
    "png",
    "std",
    # Without it the camera's default TonyMcMapFace tonemapper errors at
    # runtime and the 3D scene never draws. ~1 MiB of KTX2 LUTs.
    # `tonemapping_luts` needs a zstd backend to unpack the LUTs; the pure-Rust
    # one, because wasm has no C toolchain here.
    "tonemapping_luts",
    "zstd_rust",
    "ui_picking",
] }
tracing = { workspace = true }
serde = { workspace = true }
# The snapshot the page hands back after a restart. RON rather than JSON:
# already in the graph through `slotted-registry`, and the same format the
# rest of the workspace serialises with.
ron = { workspace = true }

# The renderer backend is the one Bevy feature that genuinely differs between
# the two ways this example runs, so it is the one thing not in the shared
# list above. `cargo run -p web-playground` wants a window on Linux and a wasm
# build wants WebGL2; compiling either for the other is module size and
# compile time spent on a backend that can never be selected.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["x11"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["webgl2"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[dev-dependencies]
slotted-testutils = { workspace = true }
slotted-browser = { workspace = true }
slotted-ecs = { workspace = true }
slotted-ui = { workspace = true }
pretty_assertions = { workspace = true }

[lints]
workspace = true
