[package]
name = "machine"
description = "slotted example: a furnace-like machine screen with a tank, bars, progress arrows, side tabs and a Lua mod injecting a sort button."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
slotted = { workspace = true, features = ["blur", "dev", "viewport"] }
slotted-packs = { workspace = true }
slotted-script = { workspace = true }
slotted-model = { workspace = true }
slotted-registry = { workspace = true, features = ["std-fs"] }
bevy = { version = "0.19.1", features = ["bevy_ui_widgets", "png"] }
ron = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
slotted-test = { workspace = true, features = ["script"] }
slotted-ecs = { workspace = true }
slotted-ui = { workspace = true }
insta = { workspace = true }
pretty_assertions = { workspace = true }

[lints]
workspace = true
