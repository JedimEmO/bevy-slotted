[package]
name = "showcase"
description = "slotted example support: the showcase's scene table, and the code the native examples and the web playground share."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[features]
default = []
# The 3D backdrop and the hover viewport tooltip. Off by default: the wasm
# module pays for `gpu-icons` the moment it is on, and the page's size budget
# (docs/design/showcase-contract.md section 7) names it as the first thing to
# drop. The native examples turn it on.
viewport = ["slotted/viewport"]

# The scene table is plain data the page, the bridge and the native tests all
# read; the lifted example code (docs/design/showcase-contract.md section 1)
# brings `slotted` and `bevy` in with `default-features = false`, never
# `std-fs`, `x11` or `gltf-icons`. Anything that reads a directory stays in the
# native example.
[dependencies]
slotted = { path = "../../crates/slotted", version = "0.1.0", default-features = false, features = ["ui", "browser", "menu", "packs", "dev", "net"] }
slotted-model = { workspace = true }
slotted-registry = { workspace = true }
bevy = { version = "0.19.1", default-features = false, features = [
    "bevy_ui_widgets",
    "bevy_asset",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_render",
    "bevy_state",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_window",
    "std",
    "ui_picking",
] }
serde = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true
